[build-system]
requires = ["flit_core>=4.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "searxbot"
dynamic = ["version"]
description = "A SearXNG search CLI and Python adapter with optional PyBot chat"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
searxbot = "searxbot:main"

[tool.flit.sdist]
include = ['CHANGELOG.md', 'requirements.txt', 'tests/', 'pybot_search.py', 'start.sh']
